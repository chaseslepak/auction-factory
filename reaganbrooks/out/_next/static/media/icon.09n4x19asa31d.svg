<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Ruled Square monogram (standard variant) per cowork/brand-tokens.json + ASSET_SPEC.md.
    1.6pt Slate Navy frame inset 14 from a 100x100 viewBox; RB in EB Garamond Medium 46pt centered.
    Tiny variant (4pt stroke, weight 600) and PNG fallbacks (16/32/180/192/512) are still TODO —
    they need source/05-avatars-favicons.html and a render pass through sharp or puppeteer.
  -->
  <rect width="100" height="100" fill="#F5F1E8"/>
  <rect x="14" y="14" width="72" height="72" fill="none" stroke="#1C2C3E" stroke-width="1.6"/>
  <text
    x="50"
    y="50"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'EB Garamond', Garamond, 'Hoefler Text', Georgia, serif"
    font-weight="500"
    font-size="46"
    letter-spacing="-1"
    fill="#1C2C3E"
  >RB</text>
</svg>
